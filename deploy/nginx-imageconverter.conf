# Example nginx site for the ImageConverter container.
# The port in proxy_pass must match IMAGECONVERTER_PORT in /etc/imageconverter/imageconverter.env.
#   sudo cp nginx-imageconverter.conf /etc/nginx/sites-available/imageconverter
#   sudo ln -s /etc/nginx/sites-available/imageconverter /etc/nginx/sites-enabled/
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/imageconverter.htpasswd maxi
#   sudo certbot --nginx -d imageconverter.example.com      # HTTPS via Let's Encrypt
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app has no login of its own and a single conversion can use all CPU cores for minutes,
# so keep the password protection unless the server is only reachable from your own network.

server {
    listen 80;
    server_name imageconverter.example.com;    # <- your domain

    # the browser uploads the image as grey-scale bytes: 1 byte per pixel (50 MP ≈ 50 MB)
    client_max_body_size 600m;

    auth_basic           "ImageConverter";
    auth_basic_user_file /etc/nginx/imageconverter.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:5080;   # <- IMAGECONVERTER_PORT
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # stream big uploads instead of buffering them to disk
    }
}
