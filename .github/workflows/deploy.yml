# Builds the web app as a Docker image, pushes it to the GitHub container registry (ghcr.io)
# and deploys it to your server on every push to main.
#
# One-time setup: see deploy/README.md.
#
# Secrets (Settings → Environments → production → Environment secrets):
#   DEPLOY_HOST         server hostname or IP
#   DEPLOY_USER         "deploy" – the restricted user created by deploy/setup-server.sh (NOT root)
#   DEPLOY_SSH_KEY      private key of the deploy key pair (whole file incl. BEGIN/END lines)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 -p <port> <host>` – pins the server's host key
#   DEPLOY_PORT         optional, SSH port (default 22)
# The registry login uses the built-in GITHUB_TOKEN – nothing to set up.

name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "src/ImageConverter.Web/**"
      - "src/ImageConverter.Algorithms/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:          # "Run workflow" button for manual deploys

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write             # push the image to ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/imageconverter" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ImageConverter.Web/Dockerfile
          # ARM server (e.g. Raspberry Pi, Ampere)? use "linux/arm64" and add docker/setup-qemu-action before buildx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key can only run the deploy script on the server: pull, start, health-check, rollback.
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" deploy "$GITHUB_SHA"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
